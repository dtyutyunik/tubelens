<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TubeLens Options</title>
    <style>
      body { font-family: Roboto, Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #0f0f0f; }
      h1 { font-size: 22px; }
      label { display: block; margin: 16px 0 6px; font-weight: 500; }
      input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
      button { background: #1a73e8; color: #fff; border: none; border-radius: 18px; padding: 8px 20px; cursor: pointer; font-size: 14px; margin-right: 8px; }
      button.secondary { background: #f1f3f4; color: #0f0f0f; }
      .row { margin-top: 12px; }
      .hint { color: #606060; font-size: 12px; margin-top: 4px; }
      .ok { color: #137333; } .err { color: #b3261e; }
      ol.setup li { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="options.js"></script>
  </body>
</html>
